name: Continuous Integration

# Least privilege: no job needs write access to the repository.
permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [lts/*, lts/-1]

    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No job pushes: never persist the GITHUB_TOKEN into .git/config,
          # where any later step (e.g. a compromised dev dependency running
          # under npm test) could read it.
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify registry signatures and provenance attestations
        run: npm audit signatures

      - name: Build
        run: npm run build:node && npm run build:browser

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:node

  test-vitest-browser:
    name: Test browser (vitest + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No job pushes: never persist the GITHUB_TOKEN into .git/config,
          # where any later step (e.g. a compromised dev dependency running
          # under npm test) could read it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "lts/*"
          check-latest: true
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

  test-contracts:
    name: Test verifier contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [lts/*]

    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No job pushes: never persist the GITHUB_TOKEN into .git/config,
          # where any later step (e.g. a compromised dev dependency running
          # under npm test) could read it.
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install hardhat dependencies
        working-directory: smart_contract_tests
        run: npm ci

      - name: Run hardhat tests
        working-directory: smart_contract_tests
        run: npm test

  test-browser:
    name: Test browser (built bundles)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [lts/*]

    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No job pushes: never persist the GITHUB_TOKEN into .git/config,
          # where any later step (e.g. a compromised dev dependency running
          # under npm test) could read it.
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: "npm"

      - name: Install browser dependencies
        working-directory: browser_tests
        run: npm ci

      - name: Run browser tests
        working-directory: browser_tests
        run: npm test
