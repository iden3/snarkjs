name: Continuous Integration
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [lts/*, lts/-1]

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:node && npm run build:browser

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:node

  test-vitest-browser:
    name: Test browser (vitest + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          check-latest: true
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

  test-contracts:
    name: Test verifier contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [lts/*]

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install hardhat dependencies
        working-directory: src/plugins/solidity/smart_contract_tests
        run: npm ci

      - name: Run hardhat tests
        working-directory: src/plugins/solidity/smart_contract_tests
        run: npm test

  test-browser:
    name: Test browser (built bundles)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [lts/*]

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: "npm"

      - name: Install browser dependencies
        working-directory: browser_tests
        run: npm ci

      - name: Run browser tests
        working-directory: browser_tests
        run: npm test
